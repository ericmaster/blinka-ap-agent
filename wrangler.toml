name = "blinka-ap-agent"
main = "src/worker.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
preview_urls = false

[[kv_namespaces]]
binding = "STATE"
id = "35536029a2244107bfdb69254a64f871"
# Secrets (never in repo): npx wrangler secret put FASTINO_API_KEY ; npx wrangler secret put JEV_API_KEY

[ai]
binding = "AI"

# Static pitch deck at /pitch/ (index.html + demo video, PPTX, PDF). Only docs/pitch/ files listed in docs/.assetsignore are uploaded.
[assets]
directory = "./docs"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
